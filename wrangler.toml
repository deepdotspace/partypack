name = "partypack"
# Matches the installed workerd build (1.20260609.1). A date newer than the
# runtime you actually run on is unsupported. Honored from this file since 0.15.0.
compatibility_date = "2026-06-09"
compatibility_flags = ["nodejs_compat", "assets_navigation_has_no_effect"]
main = "worker.ts"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*", "/ws/*", "/internal/*", "/v1/*", "/_deepspace/*"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppRecordRoom", "AppYjsRoom", "AppCanvasRoom", "AppPresenceRoom", "AppCronRoom", "AppJobRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AppGameRoom", "AppBudgetRoom"]

[durable_objects]
bindings = [
  { name = "RECORD_ROOMS", class_name = "AppRecordRoom" },
  { name = "YJS_ROOMS", class_name = "AppYjsRoom" },
  { name = "CANVAS_ROOMS", class_name = "AppCanvasRoom" },
  { name = "PRESENCE_ROOMS", class_name = "AppPresenceRoom" },
  { name = "CRON_ROOMS", class_name = "AppCronRoom" },
  { name = "JOB_ROOMS", class_name = "AppJobRoom" },
  { name = "GAME_ROOMS", class_name = "AppGameRoom" },
  { name = "BUDGET_ROOM", class_name = "AppBudgetRoom" },
]

# For per-app resources (D1, KV, Vectorize, R2, Queues), set the id field to
# "auto" — DeepSpace provisions and tears down with the deploy. Example:
#
# [[d1_databases]]
# binding = "MY_DB"
# database_name = "my-app-db"
# database_id = "auto"
#
# Full reference (all binding types + companion fields):
#   docs/proposals/binding-auto-provisioning.md

[vars]
APP_NAME = "partypack"
DEEPSPACE_APP_ID = "app_01KZ4GQH9JEJF8TPXZ6KF3R101"

[dev]
port = 8780
inspector_port = 9237

# Secrets (set via `wrangler secret put` or written by `deepspace dev`):
#   AUTH_JWT_PUBLIC_KEY
#   AUTH_JWT_ISSUER
#   AUTH_WORKER_URL
#   OWNER_USER_ID
